# Static single-page app — nothing to build, publish the repo root as-is.
[build]
  publish = "."
  command = ""

# The app shell must revalidate so a push actually reaches people who already
# have it open or installed. Everything else can be cached normally.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"

# Deep links and the magic-link callback both land on the single page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
